<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FloatBar</title>
<style>html,body{background:transparent !important;background-color:rgba(0,0,0,0) !important;}</style>
<script>window.__errs=[];window.addEventListener('error',function(e){try{window.__errs.push(String((e&&e.message)||e))}catch(_){}});</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- SVG icons (بدل الإيموجي) -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 21V9m0 0L7.5 13.5M12 9l4.5 4.5M4 4h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-temp" viewBox="0 0 24 24"><path d="M10 4a2 2 0 0 1 4 0v9.3a4.5 4.5 0 1 1-4 0V4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-ram" viewBox="0 0 24 24"><path d="M4 7h16v10H4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 11v2M11 11v2M15 11v4M7 17v1M17 17v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-batt" viewBox="0 0 24 24"><rect x="2" y="8" width="17" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 11v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect id="batt-fill" x="4.5" y="10.5" width="8" height="4" rx="1" fill="currentColor"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h4M12 16h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="16" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.3" fill="currentColor"/><circle cx="15" cy="6" r="1.3" fill="currentColor"/><circle cx="9" cy="12" r="1.3" fill="currentColor"/><circle cx="15" cy="12" r="1.3" fill="currentColor"/><circle cx="9" cy="18" r="1.3" fill="currentColor"/><circle cx="15" cy="18" r="1.3" fill="currentColor"/></symbol>
      <symbol id="i-orient" viewBox="0 0 24 24"><path d="M7 4v13m0 0l-3-3m3 3l3-3M17 20V7m0 0l-3 3m3-3l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-fold" viewBox="0 0 24 24"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <!-- شريط عائم بدون خلفية -->
  <div id="bar">
   <div class="bar-main">
    <div id="drag-handle" title="اسحب للتحريك"><svg><use href="#i-grip"/></svg></div>

    <div class="stats">
      <div class="chip net" title="سرعة النت الحالية">
        <span class="net-cols">
          <span class="net-row down"><svg><use href="#i-down"/></svg><span id="down">0</span></span>
          <span class="net-row up"><svg><use href="#i-up"/></svg><span id="up">0</span></span>
        </span>
      </div>
      <div class="chip opt" title="الحرارة">
        <svg class="ico"><use href="#i-temp"/></svg>
        <span class="val"><span id="temp">--</span><small>°</small></span>
      </div>
      <div class="chip opt" title="المعالج">
        <svg class="ico"><use href="#i-cpu"/></svg>
        <span class="val"><span id="cpu">0</span><small>%</small></span>
        <span class="meter"><span id="cpu-bar"></span></span>
      </div>
      <div class="chip opt" title="الرام">
        <svg class="ico"><use href="#i-ram"/></svg>
        <span class="val"><span id="ram">0</span><small>%</small></span>
        <span class="meter"><span id="ram-bar"></span></span>
      </div>
      <div class="chip opt" title="البطارية">
        <svg class="ico"><use href="#i-batt"/></svg>
        <span class="val"><span id="batt">--</span></span>
      </div>
    </div>

    <div class="controls">
      <button id="btn-settings" title="الإعدادات"><svg><use href="#i-sliders"/></svg></button>
      <button id="btn-hide" title="إخفاء في الأسفل"><svg><use href="#i-minus"/></svg></button>
      <button id="btn-close" title="خروج"><svg><use href="#i-x"/></svg></button>
    </div>
   </div>

    <div id="panel" class="hidden">
      <div class="bub-head"><span class="dot"></span><b>الإعدادات</b><span class="ver">v8</span><button id="btn-panel-close" title="إغلاق"><svg><use href="#i-x"/></svg></button></div>
      <div class="bub-row"><label>الشفافية</label><span id="op-val">85%</span></div>
      <input id="opacity" type="range" min="0" max="100" value="85" />
      <div class="row-btns">
        <button id="btn-test" title="اختبار سرعة"><svg><use href="#i-bolt"/></svg><span>سرعة</span></button>
        <button id="btn-orient" title="طولي / عرضي"><svg><use href="#i-orient"/></svg><span>طولي</span></button>
        <button id="btn-fold" title="طي / فرد"><svg><use href="#i-fold"/></svg><span>طي</span></button>
      </div>
      <label class="switch-row"><span>دائماً في المقدمة</span><span class="switch"><input id="ontop" type="checkbox" checked /><i></i></span></label>
      <div id="test-res" class="chat-in">اضغط زر البرق لقياس سرعة النت</div>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
